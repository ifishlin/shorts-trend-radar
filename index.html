<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shorts 發燒話題雷達</title>
<style>
:root{--bg:#0b1020;--panel:#121936;--text:#f5f7ff;--muted:#9eabd1;--line:#29345f;--accent:#7c9cff;--good:#59d39b;--warn:#ffd166;--pink:#ff7db8;--shadow:0 18px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(124,156,255,.16),transparent 35%),radial-gradient(circle at 90% 10%,rgba(255,125,184,.10),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1380px;margin:auto;padding:28px}header{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}h1{margin:0;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}.sub{color:var(--muted);margin-top:8px;max-width:780px;line-height:1.55}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#0e1530;color:#cbd5ff;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 14px var(--good)}.toolbar{display:grid;grid-template-columns:1.6fr repeat(3,minmax(120px,.55fr));gap:10px;margin:18px 0}input,select,button{font:inherit}.control{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:18px;padding:17px}.stat .n{font-size:29px;font-weight:800}.stat .k{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;background:linear-gradient(180deg,var(--panel),#0f1630);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:.16s ease;cursor:pointer}.card:hover{transform:translateY(-2px);border-color:#465992}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{justify-content:space-between;align-items:flex-start}.title{font-size:20px;font-weight:780;line-height:1.28;margin:12px 0 8px}.desc{color:#c3cbea;line-height:1.55;font-size:14px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#1b254b;border:1px solid #32406f;color:#cbd5ff}.source{font-size:11px;color:var(--muted)}.score{min-width:62px;text-align:center;border-radius:16px;padding:10px 8px;background:#0d1430;border:1px solid var(--line)}.score b{font-size:22px;display:block}.score small{color:var(--muted);font-size:10px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.meterLabel{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:6px}.track{height:7px;background:#0a1024;border-radius:99px;overflow:hidden;border:1px solid #202b53}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#a787ff)}.fill.fun{background:linear-gradient(90deg,var(--warn),var(--pink))}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#151e40;color:#dde4ff;border-radius:11px;padding:9px 11px;cursor:pointer}.btn.primary{background:#6f86ff;border-color:#6f86ff;color:white;font-weight:700}.fav{position:absolute;right:14px;bottom:14px;font-size:18px;background:transparent;border:0;cursor:pointer}.empty{grid-column:1/-1;color:var(--muted);padding:50px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px}.footer{color:#7f8ab1;font-size:12px;line-height:1.6;margin-top:20px}.modal{display:none;position:fixed;inset:0;background:rgba(4,7,18,.76);backdrop-filter:blur(8px);z-index:50;padding:24px}.modal.show{display:flex;align-items:center;justify-content:center}.dialog{width:min(780px,100%);max-height:88vh;overflow:auto;background:#101735;border:1px solid #344274;border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.dialog h2{margin:10px 0 12px;font-size:28px}.section{margin-top:20px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8391bd;margin-bottom:8px}.angle{padding:12px 14px;background:#171f43;border:1px solid var(--line);border-radius:14px;line-height:1.55}.close{float:right;border:0;background:#1a244a;color:white;border-radius:10px;padding:8px 10px;cursor:pointer}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{padding:16px}.toolbar{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}header{display:block}.badge{margin-top:14px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>🔥 Shorts 發燒話題雷達</h1><div class="sub">不是找「最重要的新聞」，而是找 <b>正在升溫、可快速解釋、有畫面、適合 30–60 秒短影音</b> 的題材。目前內容是 2026-10-02 的手動快照。</div></div><div class="badge"><span class="dot"></span> Prototype · 2026-10-02</div></header>
<div class="toolbar">
<input id="q" class="control" placeholder="搜尋話題、關鍵字、來源…" />
<select id="category" class="control"><option value="all">全部類型</option><option>奇聞</option><option>網路迷因</option><option>科技</option><option>科學</option><option>新聞反轉</option><option>運動</option></select>
<select id="minScore" class="control"><option value="0">Shorts 分數：全部</option><option value="70">≥ 70</option><option value="80">≥ 80</option><option value="90">≥ 90</option></select>
<select id="sort" class="control"><option value="short">排序：Shorts 潛力</option><option value="fun">排序：廢新聞潛力</option><option value="trend">排序：趨勢熱度</option><option value="new">排序：最新</option></select>
</div>
<section class="summary"><div class="stat"><div class="n" id="total">0</div><div class="k">目前候選題材</div></div><div class="stat"><div class="n" id="hot">0</div><div class="k">Shorts ≥ 85</div></div><div class="stat"><div class="n" id="fun">0</div><div class="k">廢新聞潛力 ≥ 85</div></div><div class="stat"><div class="n" id="favCount">0</div><div class="k">你收藏的題材</div></div></section>
<main class="grid" id="grid"></main>
<div class="footer">這個版本是可瀏覽原型。下一版可以接 Google Trends、Reddit、YouTube / RSS，自動每 30–60 分鐘更新並重新計算分數。</div>
</div>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<script>
const topics=[
{id:"rory",title:"Rory Stewart 的「超怪凝視」片段爆紅，本人回應：我的肢體語言就是有點怪",category:"網路迷因",source:"AOL / The Independent",time:"2026-10-01T10:14:00Z",trend:91,short:95,fun:96,desc:"一段 BBC Newsnight 畫面因為表情與凝視方式被大量轉傳，當事人隔天公開回應。",why:"有原始影片、有明確人物、有一句能當 punchline 的回應，而且不需要長背景。",angle:"開場直接放 1–2 秒凝視畫面 →「網友都在問：他到底為什麼這樣看？」→ 本人回應 → 補一句節目背景。",link:"https://www.aol.com/articles/rory-stewart-breaks-silence-weird-101433000.html",tags:["有影片","人物反應","迷因"]},
{id:"hughes",title:"冰球明星 Jack Hughes 訪問到一半直接滑走：『這是個很怪的玩笑』",category:"運動",source:"Awful Announcing",time:"2026-10-02T08:00:00Z",trend:86,short:94,fun:91,desc:"ESPN 訪問中的一句玩笑讓氣氛瞬間尷尬，球員回答後直接離開鏡頭。",why:"非常適合短影音：前因只要一句話，核心是現場尷尬反應，而且有天然結尾。",angle:"先放離場畫面 → 回放主持人說了什麼 →『問題其實踩到他上季傷病』→ 15 秒即可講完。",link:"https://awfulannouncing.com/nhl/jack-hughes-skates-away-from-tense-interview-with-espns-aj-mleczko.html",tags:["尷尬現場","原始片段","運動"]},
{id:"applepay",title:"網路爆紅工具號稱可以把 Apple Pay 卡片外觀改成任何樣子",category:"科技",source:"The Tab",time:"2026-10-02T06:00:00Z",trend:84,short:88,fun:83,desc:"一個自訂 Apple Pay 卡片視覺的工具正在社群上快速擴散，引發大量教學與實測。",why:"畫面明確、容易 demo，而且觀眾會立刻問『真的可以？安全嗎？』。",angle:"「你的 Apple Pay 卡可以長這樣？」→ 3 秒示範 → 解釋它實際改的是什麼 → 安全性提醒。",link:"https://thetab.com/2026/10/02/this-viral-tool-lets-you-customise-your-apple-pay-cards-and-heres-how-to-do-it",tags:["科技","可Demo","病毒式傳播"]},
{id:"flydubai",title:"FlyDubai 事件後，舊影片被重新包裝成『乘客慶祝』與『飛機墜落』",category:"新聞反轉",source:"Lead Stories",time:"2026-10-01T12:00:00Z",trend:93,short:92,fun:78,desc:"多段與事件無關的舊影片被重新貼上標籤，在社群上快速流傳，事實查核網站逐一追來源。",why:"『你看到的熱門影片其實不是這件事』是很強的短影音結構，而且能教觀眾辨識假素材。",angle:"先放流傳說法（不要重播誤導畫面太久）→『但這段其實是 2025 年的…』→ 顯示原始來源對照。",link:"https://leadstories.com/breaking/2026/10/",tags:["fact-check","舊影片","反轉"]},
{id:"weirdtoday",title:"有人真的做了一個『今天發生什麼怪事』網站，還把 Wikipedia 爆改條目也算成指標",category:"奇聞",source:"WWSHT",time:"2026-10-01T20:01:00Z",trend:76,short:90,fun:98,desc:"WWSHT 每天從大量公開資料源挑出異常數字，例如某 Wikipedia 條目一天被大量修改。",why:"題材本身就很 meta：『找廢新聞的網站』也可以變成一則廢新聞，而且很適合系列化。",angle:"「有人每天認真統計今天到底發生了什麼怪事。」→ 快速展示 3 個例子 →『這其實就是我們要的發燒雷達。』",link:"https://wwsht.com/2026/10/01/",tags:["資料網站","meta","系列題材"]},
{id:"bats",title:"大型基因體＋化石研究：蝙蝠可能約 6500 萬年前起源於歐洲",category:"科學",source:"Plaintext Today（摘要入口）",time:"2026-10-01T09:00:00Z",trend:69,short:81,fun:64,desc:"研究把大量蝙蝠基因體與化石資料放在一起，重新討論飛行與回聲定位何時出現。",why:"畫面好找、科學反直覺，但需要確認原始研究後再做，不能只靠二手摘要。",angle:"「蝙蝠最早可能不是從你以為的地方出現。」→ 65 million years → 飛行＋回聲定位的演化問題。",link:"https://plaintext.today/2026/10/01",tags:["科學","動物","需查原論文"]}
];
const favKey="shorts-radar-favs-v1";let favs=new Set(JSON.parse(localStorage.getItem(favKey)||"[]"));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function hoursAgo(iso){const h=Math.max(0,(Date.now()-new Date(iso))/36e5);if(h<1)return"剛剛";if(h<24)return Math.floor(h)+" 小時前";return Math.floor(h/24)+" 天前"}
function saveFav(){localStorage.setItem(favKey,JSON.stringify([...favs]));render()}
function toggleFav(id,e){e.stopPropagation();favs.has(id)?favs.delete(id):favs.add(id);saveFav()}
function render(){const q=document.getElementById("q").value.trim().toLowerCase(),cat=document.getElementById("category").value,min=+document.getElementById("minScore").value,sort=document.getElementById("sort").value;let arr=topics.filter(t=>{const hay=(t.title+" "+t.desc+" "+t.source+" "+t.tags.join(" ")).toLowerCase();return(!q||hay.includes(q))&&(cat==="all"||t.category===cat)&&t.short>=min});const sorters={short:(a,b)=>b.short-a.short,fun:(a,b)=>b.fun-a.fun,trend:(a,b)=>b.trend-a.trend,new:(a,b)=>new Date(b.time)-new Date(a.time)};arr.sort(sorters[sort]);document.getElementById("total").textContent=topics.length;document.getElementById("hot").textContent=topics.filter(t=>t.short>=85).length;document.getElementById("fun").textContent=topics.filter(t=>t.fun>=85).length;document.getElementById("favCount").textContent=favs.size;const g=document.getElementById("grid");if(!arr.length){g.innerHTML='<div class="empty">沒有符合條件的題材。</div>';return}g.innerHTML=arr.map(t=>'<article class="card" onclick="openModal(\''+t.id+'\')"><div class="row top"><div class="row"><span class="tag">'+esc(t.category)+'</span><span class="source">'+esc(t.source)+' · '+hoursAgo(t.time)+'</span></div><div class="score"><b>'+t.short+'</b><small>SHORTS</small></div></div><div class="title">'+esc(t.title)+'</div><div class="desc">'+esc(t.desc)+'</div><div class="row" style="margin-top:11px">'+t.tags.map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+'</div><div class="meters"><div><div class="meterLabel"><span>🔥 趨勢熱度</span><span>'+t.trend+'</span></div><div class="track"><div class="fill" style="width:'+t.trend+'%"></div></div></div><div><div class="meterLabel"><span>🗑️ 廢新聞潛力</span><span>'+t.fun+'</span></div><div class="track"><div class="fill fun" style="width:'+t.fun+'%"></div></div></div></div><div class="actions"><button class="btn primary" onclick="event.stopPropagation();openModal(\''+t.id+'\')">看選題角度</button><button class="btn" onclick="event.stopPropagation();window.open(\''+t.link+'\',\'_blank\')">原始來源 ↗</button></div><button class="fav" title="收藏" onclick="toggleFav(\''+t.id+'\',event)">'+(favs.has(t.id)?"⭐":"☆")+'</button></article>').join("")}
function openModal(id){const t=topics.find(x=>x.id===id);if(!t)return;document.getElementById("modalBody").innerHTML='<div class="row"><span class="tag">'+esc(t.category)+'</span><span class="source">'+esc(t.source)+' · '+hoursAgo(t.time)+'</span></div><h2>'+esc(t.title)+'</h2><div class="desc">'+esc(t.desc)+'</div><div class="section"><h3>為什麼適合 Shorts</h3><div class="angle">'+esc(t.why)+'</div></div><div class="section"><h3>30–60 秒講法</h3><div class="angle">'+esc(t.angle)+'</div></div><div class="section"><h3>分數</h3><div class="row"><span class="tag">Trend '+t.trend+'</span><span class="tag">Shorts '+t.short+'</span><span class="tag">廢新聞 '+t.fun+'</span></div></div><div class="actions"><button class="btn primary" onclick="window.open(\''+t.link+'\',\'_blank\')">打開原始來源 ↗</button></div>';document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});["q","category","minScore","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));render();
</script>
</body>
</html>
